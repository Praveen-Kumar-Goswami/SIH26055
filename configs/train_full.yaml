# Stage 5 full training profile. Hyperparameters and validation seeds only.
# Do not tune on configs/benchmark_final.yaml or held_out_manifest.json.
schema_version: "1.0.0"
seed: 0
device: cpu
timesteps: 200000
n_envs: 1
n_epochs_predictor: 8
batch_size: 64
dt_s: 0.001
duration_s: 0.5
band_plan_id: demo_2_18
receiver_config: configs/receiver.yaml
noise_power_w: 1.0e-13
dwell_bins: [1, 2, 4, 8, 16]
default_dwell_steps: 8
horizon_steps: 160
forecast_command_bins: 8
mc_rollouts: 128
collect_strategies: [sequential, random, fixed-priority, reactive]
train_scenarios:
  - {scenario_id: sparse, seeds: [0, 1, 2, 3, 4, 5]}
  - {scenario_id: dense, seeds: [0, 1, 2, 3]}
  - {scenario_id: agile_threat, seeds: [0, 1, 2, 3, 4, 5]}
val_scenarios:
  - {scenario_id: sparse, seeds: [200, 201]}
  - {scenario_id: dense, seeds: [200]}
  - {scenario_id: agile_threat, seeds: [200, 201]}
test_scenarios: []
public_priorities: [8, 4, 10]
predictor_hidden: 64
predictor_lr: 0.003
ppo_learning_rate: 0.0003
ppo_n_steps: 2048
ppo_batch_size: 64
ppo_n_epochs: 10
ppo_gamma: 0.99
ppo_ent_coef: 0.01
ppo_net_arch: [256, 256]
ewma_alpha: 0.3
model_version: "0.1.0"
early_stopping_patience: 5
eval_cadence: 10000
reward:
  w_hit: 1.0
  w_priority: 0.5
  c_tune: 0.1
  c_time: 0.05
  c_repeat: 0.2
  c_false_like: 0.1
  lambda_novelty: 0.2
  lambda_uncertainty: 0.1
  novelty_bonus_cap: 0.5
  uncertainty_bonus_cap: 0.5
