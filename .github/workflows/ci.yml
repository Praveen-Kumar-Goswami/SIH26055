name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install -U pip uv
      - name: Frozen sync
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy src
      - name: Pytest (tiny fixtures only)
        env:
          SMARTSCAN_FULL_BENCH: "0"
          SMARTSCAN_FULL_TRAIN: "0"
          SMARTSCAN_SKIP_PERF: "1"
        run: uv run pytest tests --cov=smartscan --cov-fail-under=85
